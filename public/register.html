<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Yaathirai</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container { max-width: 440px; margin: 60px auto; padding: 30px; border-radius: 12px; background: #fffdf7; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .auth-container h2 { margin-bottom: 20px; font-family: "Archivo", sans-serif; color: #7c2638; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .pwd-wrapper { position: relative; display: flex; align-items: center; }
    .pwd-wrapper input { padding-right: 42px; }
    .pwd-toggle { position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 0.8rem; color: #7c2638; padding: 4px; }
    .pwd-hint { display: block; font-size: 0.72rem; color: #6f5f56; margin-top: 4px; line-height: 1.3; }
    .auth-btn { width: 100%; padding: 12px; background: #7c2638; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .error-msg { color: #b02a37; font-size: 0.8rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Create an Account</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="pwd-wrapper">
          <input type="password" id="password" required autocomplete="new-password">
          <button type="button" class="pwd-toggle" onclick="toggleVisibility('password', this)" aria-label="Toggle password visibility">Show</button>
        </div>
        <span class="pwd-hint">At least 8 characters, uppercase &amp; lowercase letters, number &amp; special character.</span>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="pwd-wrapper">
          <input type="password" id="confirmPassword" required autocomplete="new-password">
          <button type="button" class="pwd-toggle" onclick="toggleVisibility('confirmPassword', this)" aria-label="Toggle confirm password visibility">Show</button>
        </div>
      </div>
      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile">
      </div>
      <div class="form-group">
        <label for="role">Account Type</label>
        <select id="role">
          <option value="CUSTOMER">Customer / Traveler</option>
          <option value="PROVIDER">Local Tourist / Package Provider</option>
        </select>
      </div>
      <button type="submit" class="auth-btn">Register</button>
      <p id="errorMsg" class="error-msg"></p>
    </form>
    <p style="margin-top:15px; font-size:0.8rem;">Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function checkPasswordStrength(p) {
      if (!p || p.length < 8) return 'Password must be at least 8 characters long.';
      if (!/[A-Z]/.test(p)) return 'Password must include at least one uppercase letter (A-Z).';
      if (!/[a-z]/.test(p)) return 'Password must include at least one lowercase letter (a-z).';
      if (!/[0-9]/.test(p)) return 'Password must include at least one number (0-9).';
      if (!/[!@#$%^&*()_+\-=[\]{};\':"\\|,.<>/?~`]/.test(p)) return 'Password must include at least one special character.';
      return null;
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const mobile = document.getElementById('mobile').value.trim();
      const role = document.getElementById('role').value;

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Password and Confirm Password do not match.';
        return;
      }

      const strengthErr = checkPasswordStrength(password);
      if (strengthErr) {
        errorMsg.textContent = strengthErr;
        return;
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirmPassword, mobile, role })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Registration failed');

        // Local Tourist: sign in with the existing /api/login and open the provider dashboard.
        if (role === 'PROVIDER') {
          const loginRes = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const loginData = await loginRes.json();
          if (loginRes.ok && loginData.user && String(loginData.user.role).toUpperCase() === 'PROVIDER') {
            localStorage.setItem('user', JSON.stringify(loginData.user));
            window.location.href = 'provider/dashboard.html';
            return;
          }
        }

        alert('Registration successful! Please login.');
        window.location.href = 'login.html';

      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
