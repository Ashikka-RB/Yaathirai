<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Yaathirai</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .profile-box { max-width: 500px; margin: 40px auto; padding: 25px; background: #fffdf7; border-radius: 12px; border: 1px solid #ccc; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .btn-save { width: 100%; padding: 12px; background: #7c2638; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="profile-box">
    <h2>Manage Profile</h2>
    <form id="profileForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Email Address (Read only)</label>
        <input type="email" id="email" disabled>
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="mobile">
      </div>
      <div class="form-group">
        <label>Address Line</label>
        <input type="text" id="addressLine">
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" id="city">
      </div>
      <button type="submit" class="btn-save">Update Profile</button>
    </form>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = '../login.html';

    document.getElementById('name').value = user.name || '';
    document.getElementById('email').value = user.email || '';

    document.getElementById('profileForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Profile details saved locally!');
    });
  </script>
</body>
</html>
