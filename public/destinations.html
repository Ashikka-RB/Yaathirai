<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinations - Yaathirai</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dest-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .dest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
    .dest-card { border: 1px solid #e0e0e0; border-radius: 12px; overflow: hidden; background: #fffdf7; }
    .dest-card img { width: 100%; height: 180px; object-fit: cover; }
    .dest-body { padding: 15px; }
    .dest-body h3 { color: #7c2638; margin-top: 0; }
    .btn-explore { display: inline-block; margin-top: 10px; padding: 8px 14px; background: #7c2638; color: white; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="dest-container">
    <h2>Popular Destinations in Tamil Nadu</h2>
    <div class="dest-grid" id="destGrid"></div>
  </div>

  <script>
    // Local fallback data if running without MySQL database connected
    const fallbackDestinations = [
      { name: "Ooty", state: "Tamil Nadu", image: "images/ooty.jpg", description: "Misty hills and tea gardens in the Nilgiris." },
      { name: "Kodaikanal", state: "Tamil Nadu", image: "images/kodaikanal.jpg", description: "Quiet lakes and cool pine trails." },
      { name: "Kanyakumari", state: "Tamil Nadu", image: "images/kanyakumari.jpg", description: "Ocean horizons where three waters meet." },
      { name: "Madurai", state: "Tamil Nadu", image: "images/madurai.jpg", description: "Ancient temple towers and rich heritage." }
    ];

    function renderDestinations(list) {
      document.getElementById('destGrid').innerHTML = list.map(d => `
        <div class="dest-card">
          <img src="${d.image || 'images/ooty.jpg'}" alt="${d.name}">
          <div class="dest-body">
            <h3>${d.name}</h3>
            <p>${d.description || ''}</p>
            <a class="btn-explore" href="customer/packages.html?destination=${encodeURIComponent(d.name)}">Explore Packages</a>
          </div>
        </div>
      `).join('');
    }

    // Attempt to fetch from API, else use static list
    fetch('/api/destinations')
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(data => renderDestinations(data.length ? data : fallbackDestinations))
      .catch(() => renderDestinations(fallbackDestinations));
  </script>
</body>
</html>
