<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Yaathirai</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container { max-width: 400px; margin: 80px auto; padding: 30px; border-radius: 12px; background: #fffdf7; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .auth-container h2 { margin-bottom: 20px; font-family: "Archivo", sans-serif; color: #7c2638; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; font-weight: bold; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .auth-btn { width: 100%; padding: 12px; background: #7c2638; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .error-msg { color: red; font-size: 0.8rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Login to Yaathirai</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="auth-btn">Login</button>
      <p id="errorMsg" class="error-msg"></p>
    </form>
    <p style="margin-top:15px; font-size:0.8rem;">Don't have an account? <a href="register.html">Register here</a></p>
  </div>

  <!-- YOUR SCRIPT BLOCK IS KEPT HERE -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        localStorage.setItem('user', JSON.stringify(data.user));

        // Updated paths for role dashboards
        if (data.user.role === 'CUSTOMER') window.location.href = '/customer/customer-dashboard.html';
        else if (data.user.role === 'PROVIDER') window.location.href = '/provider/provider-dashboard.html';
        else if (data.user.role === 'ADMIN') window.location.href = '/admin/admin-dashboard.html';
        else if (data.user.role === 'SUPER_ADMIN') window.location.href = '/superadmin/superadmin-dashboard.html';

      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
